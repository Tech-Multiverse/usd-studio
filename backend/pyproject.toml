[project]
name = "usd-studio-backend"
version = "0.1.0"
description = "FastAPI backend for USD Studio using NVIDIA OVRTX/OVSTREAM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "imageio[ffmpeg]>=2.36.0",
    "ovrtx",
    "ovphysx==0.4.13",
    "ovstream",
    "warp-lang",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
usd-studio = "usd_studio.main:main"

[tool.ruff]
line-length = 120
