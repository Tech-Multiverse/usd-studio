version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "8000:8000"
      - "49100:49100"
    volumes:
      - ./data:/data:ro
      - ./outputs:/outputs
    command: uvicorn usd_studio.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
